name: Windows release

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Build a signed draft release (select an existing v<version> tag)'
        type: boolean
        default: false
      compatibility_verified:
        description: 'Clean VM / real previous-version upgrade, schema rollback and license review completed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch' || !inputs.sign_release
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install locked toolchain
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap failed' }
          uv venv .venv-release --python 3.12.10 --no-python-downloads --clear
          if ($LASTEXITCODE -ne 0) { throw 'Venv failed' }
          uv pip sync pylock.windows.toml --python .venv-release/Scripts/python.exe --require-hashes --only-binary :all:
          if ($LASTEXITCODE -ne 0) { throw 'Sync failed' }
          ./tools/release/bootstrap-inno.ps1
      - name: Build and verify unsigned candidate
        shell: pwsh
        run: ./tools/release/windows.ps1 -Unsigned -OutputDir dist/ci-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned-candidate
          path: dist/ci-candidate/*
          if-no-files-found: error
          retention-days: 14

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    runs-on: [self-hosted, Windows, X64, license-admin-signing]
    environment: windows-release
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Require reviewed tag and compatibility attestation
        shell: pwsh
        env:
          REVIEWED: ${{ inputs.compatibility_verified }}
          REF: ${{ github.ref }}
        run: |
          if ($env:REVIEWED -ne 'true' -or -not $env:REF.StartsWith('refs/tags/v')) { throw 'Select a version tag and attest clean-VM compatibility/license review' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Build signed and timestamped artifacts
        shell: pwsh
        env:
          CODE_SIGN_CERT_SHA1: ${{ vars.CODE_SIGN_CERT_SHA1 }}
          CODE_SIGN_TIMESTAMP_URL: ${{ vars.CODE_SIGN_TIMESTAMP_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap failed' }
          uv venv .venv-release --python 3.12.10 --no-python-downloads --clear
          if ($LASTEXITCODE -ne 0) { throw 'Venv failed' }
          uv pip sync pylock.windows.toml --python .venv-release/Scripts/python.exe --require-hashes --only-binary :all:
          if ($LASTEXITCODE -ne 0) { throw 'Sync failed' }
          $version = (& .venv-release/Scripts/python.exe -m tools.release.metadata).Trim()
          if ($LASTEXITCODE -ne 0 -or $env:REF_NAME -ne "v$version") { throw 'Tag does not match application version' }
          ./tools/release/bootstrap-inno.ps1
          ./tools/release/windows.ps1 -OutputDir "dist/signed-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Create draft only (never auto-publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem -LiteralPath "dist/signed-${{ github.run_id }}-${{ github.run_attempt }}" -File | ForEach-Object FullName
          gh release create $env:TAG --verify-tag --draft --title "License Admin $env:TAG" --notes 'Signed Windows candidate. Review SHA256SUMS, SBOM, notices and validation reports before publishing.' @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; never overwrite an existing release automatically' }
